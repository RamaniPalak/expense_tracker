services:
  # ── Genkit AI Sidecar ──────────────────────────────────────────────────────
  # Receipt/bill scanning service powered by Gemini multimodal AI via Genkit.
  # Accessible internally at http://genkit:3001 from other services.
  genkit:
    build:
      context: ../genkit_service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"   # Expose on host for local Flutter dev (10.0.2.2:3001)
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Development services ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: backend
      POSTGRES_PASSWORD: "GLNXyG_VR3FlxU3ZhyMRGP5sm2Qq9ad4"
    volumes:
      - backend_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "g2P8uhLbAj2dULMwVOPjWBQBV_EuoM7N"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: backend_test
      POSTGRES_PASSWORD: "tqo7AQAMxYUiOitGRxdXDSI57pTmrQHy"
    volumes:
      - backend_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "rLyQfbKXCO7DPlEr1Z6k8gBomW_np5_3"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  backend_data:
  backend_test_data:
